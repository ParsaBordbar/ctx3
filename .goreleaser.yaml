# GoReleaser builds cross-platform binaries and attaches them to a GitHub
# Release on every pushed tag, so users can `curl … | sh` without a Go toolchain.
# Docs: https://goreleaser.com
version: 2

project_name: ctx3

before:
  hooks:
    - go mod tidy

builds:
  - id: ctx3
    main: .
    binary: ctx3
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/parsabordbar/ctx3/internal/version.version={{ .Version }}

archives:
  # Predictable names so install.sh can hit /releases/latest/download/<asset>.
  - id: ctx3
    name_template: "ctx3_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: parsabordbar
    name: ctx3

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
